# ITCS355 Lab 4 — continuous integration.
#
# The sequence matters: cheap checks first, so a schema mistake fails in 30 seconds
# rather than after a build. Deploy is in cd.yml and runs only on main, only on green.
#
#   secret scan → lint → unit → data contract → model behaviour → service
#     → build images (tagged by commit SHA) → integration test
#     → push serving image (main only) → cd.yml deploys it to staging (main only)

name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A change to the write-up alone ships nothing, so it does not rebuild and redeploy.
    paths-ignore: ['**.md', 'reports/**', 'course/**', 'docs/**']

permissions:
  contents: read
  id-token: write        # required for OIDC. See cd.yml — no long-lived keys anywhere.

# cloudlayer reads its configuration from the environment. cloud.env is never committed;
# these come from repository variables, and the identity from the OIDC exchange below.
env:
  CLOUD_PROVIDER: gcp
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.REGION }}
  BLOB_URI: ${{ vars.BLOB_URI }}
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
  MODEL_REGISTRY_NAME: ${{ vars.MODEL_REGISTRY_NAME }}
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db
  IDENTITY_REF: github-oidc

jobs:
  # First, and on its own, because it is the only check whose failure cannot be
  # undone by a later commit. Stdlib only — no pip install, so it reports in
  # seconds and never waits on a dependency resolution that might itself be the
  # thing that broke.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # NOT optional. The default depth of 1 makes this scan useless: it would
          # see a single commit and pass on a repository full of leaked keys. The
          # scanner refuses to run on a shallow clone rather than pass quietly, so
          # removing this line fails the job — which is the intended behaviour.
          fetch-depth: 0

      - name: Scan history for credentials
        run: python3 scripts/scan_secrets.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          # Every line of requirements.txt carries hashes, so a package whose bytes
          # changed on the index fails here instead of being installed.
          pip install --require-hashes -r requirements.txt

      - name: Lint
        # ruff is pinned in requirements.txt and installed above. Installing it unpinned
        # here would let a new ruff release fail this build on unchanged code.
        run: ruff check src/ service/ monitoring/ scripts/ tests/

      - name: Portability audit
        run: python scripts/portability_audit.py

      - name: Generate dataset
        run: python scripts/make_dataset.py

      - name: Unit tests
        # Code, not data: the split logic, the drift statistics, the stream generator.
        run: pytest -q -m "not contract" tests/test_data.py tests/test_drift.py

      - name: Data contract tests
        # Assertions about the data itself. These fail when the producer changes
        # something, even though no code here did.
        run: pytest -q -m contract tests/test_data.py

      - name: Model behaviour tests
        run: pytest -q tests/test_model_behaviour.py

      - name: Service tests
        run: pytest -q tests/test_service.py

  build:
    # Both, deliberately: nothing gets built or pushed from a commit that leaks a
    # credential, even though CD already gates on the whole workflow being green.
    needs: [test, secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The integration test below runs make_dataset/train/export on the runner to
      # produce the artefact the serving container is then asked to serve, so this job
      # needs the same interpreter and pins as the test job.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      # Images are tagged with the commit SHA, never a floating tag. A floating tag makes
      # it impossible to say which code is serving, which is the question you will be
      # asked during an incident.
      - name: Build training image
        run: docker buildx build --platform linux/amd64 -t itcs355:${{ github.sha }} --load .

      - name: Build serving image
        run: docker buildx build --platform linux/amd64 -f service/Dockerfile.serve -t itcs355-serve:${{ github.sha }} --load .

      - name: Integration test
        run: |
          python scripts/make_dataset.py
          python -m src.train --metrics-out reports/metrics.json
          python scripts/export_model.py --out reports/model.joblib
          docker run -d --name svc -p 8080:8080 \
            -v "$PWD/reports:/app/reports:ro" \
            -e MODEL_PATH=/app/reports/model.joblib \
            -e MODEL_VERSION=${{ github.sha }} \
            itcs355-serve:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf localhost:8080/ready && break || sleep 2
          done
          SERVICE_URL=http://localhost:8080 EXPECTED_MODEL_VERSION=${{ github.sha }} \
            pytest -v tests/test_integration.py

      - name: Container log
        if: always()
        run: docker logs svc 2>&1 | tail -50; docker rm -f svc || true

      # --- main only: publish the image that was just tested ----------------------
      # A pull request never gets cloud credentials: the identity pool only trusts
      # tokens whose ref is refs/heads/main (infra/gcp/github-oidc.sh).
      - name: Authenticate to GCP (OIDC, main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v3

      - name: Push serving image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ref=$(python -c "from src import config; from cloudlayer.factory import get_adapter; \
            print(get_adapter(config.load()).push_image('itcs355-serve:${{ github.sha }}'))")
          echo "pushed $ref"
          echo "Serving image: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
