# ITCS355 Lab 4 — continuous deployment.
#
# Runs only on main, only after CI is green. Credentials come from OIDC federation, not
# from stored keys: GitHub signs a short-lived token for this run, Google exchanges it for
# the deployer service account, and nothing that could leak is stored anywhere. The pool
# trusts only this repository's main branch (infra/gcp/github-oidc.sh).
#
# It deploys the image CI built, tested and pushed for this exact commit, looked up by
# its SHA tag and deployed by digest. Nothing is rebuilt here.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    # Green, and a push to main. A pull request whose head branch happens to be called
    # main (from a fork) also arrives here as branch "main"; the event check stops it.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUD_PROVIDER: gcp
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      BLOB_URI: ${{ vars.BLOB_URI }}
      CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
      MODEL_REGISTRY_NAME: ${{ vars.MODEL_REGISTRY_NAME }}
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      IDENTITY_REF: github-oidc
      SHA: ${{ github.event.workflow_run.head_sha }}
      ENDPOINT: itcs355-staging
      SERVE_EVENTS: reports/lab4/cd-events.jsonl
    steps:
      # workflow_run checks out the default branch's newest commit unless told
      # otherwise, which is not necessarily the commit CI just tested.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # The serving lock is enough to drive the adapter, and much smaller.
        run: pip install --require-hashes -r requirements-serve.txt

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Find the image CI pushed for this commit
        id: image
        run: |
          repo="$CONTAINER_REGISTRY/itcs355-serve"
          digest=$(gcloud artifacts docker images describe "$repo:$SHA" \
            --format='value(image_summary.digest)')
          test -n "$digest" || { echo "no image tagged $SHA — did CI push it?"; exit 1; }
          echo "ref=$repo@$digest" >> "$GITHUB_OUTPUT"
          echo "deploying $repo@$digest (commit $SHA)"

      - name: Deploy to staging
        # Registry version from a repository variable: which model is a release decision,
        # not something a code commit should change by accident. Staging scales to zero
        # when idle, so it costs nothing between deploys; label lab=4 for teardown.
        run: |
          python scripts/serve_ctl.py --endpoint "$ENDPOINT" deploy \
            --version "${{ vars.MODEL_VERSION }}" --instance 1cpu-2gi \
            --image "${{ steps.image.outputs.ref }}" \
            --min-instances 0 --max-instances 1 --lab 4
          echo "url=$(python scripts/serve_ctl.py --endpoint "$ENDPOINT" url)" >> "$GITHUB_ENV"

      # The service is private. Smoke-testing it needs an identity token for its URL,
      # which only exists after the deploy, so this is a second exchange.
      - id: idtoken
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ${{ env.url }}
          id_token_include_email: true

      - name: Smoke test
        # Three known payloads through adapter.invoke: one row, a batch, one the schema
        # must reject. A deploy that is not smoke-tested is a deploy you have not verified.
        env:
          SERVICE_ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
        run: python scripts/serve_ctl.py --endpoint "$ENDPOINT" smoke

      - name: Keep the deploy record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cd-events-${{ github.event.workflow_run.head_sha }}
          path: reports/lab4/cd-events.jsonl
          if-no-files-found: ignore
